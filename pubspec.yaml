name: firebase_cloud_messaging_dart
description: >-
  A pure Dart server-side client for sending Firebase Cloud Messages through the
  FCM HTTP v1 API. It does not implement native Flutter registration or receive
  handlers. Includes service-account and Application Default Credentials support.
version: 4.0.0
homepage: https://github.com/OttomanDeveloper/firebase_cloud_messaging_dart

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  json_annotation: ^4.12.0
  meta: ^1.19.0

dev_dependencies:
  # build_runner 2.16.0 raises its SDK floor to Dart 3.11.0.
  build_runner: ">=2.15.1 <2.16.0"
  coverage: ^1.15.1
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  # test 1.31.2 raises its SDK floor to Dart 3.11.0.
  test: ^1.31.1
